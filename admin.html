<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#006C35">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدارة | منصة قوى لتأشيرات العمل</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
/* =====================================================================
   المتغيرات العامة
   ===================================================================== */
:root{
  --green:#006C35;
  --green-dark:#00532A;
  --green-soft:#E6F2EB;
  --gold:#C8A96A;
  --gold-soft:#F8F2E4;
  --danger:#C53030;
  --danger-soft:#FDECEC;
  --warn:#B7791F;
  --warn-soft:#FEF6E7;
  --info:#2B6CB0;
  --info-soft:#EAF2FB;

  --text:#1A1A1A;
  --text-2:#4A5568;
  --text-3:#718096;

  --bg:#F5F7F6;
  --bg-2:#FAFBFC;
  --white:#FFFFFF;
  --border:#E3E8E5;
  --border-2:#EEF1EF;

  --radius:14px;
  --radius-sm:10px;
  --radius-lg:20px;
  --radius-pill:999px;

  --shadow-xs:0 1px 2px rgba(15,20,25,.04);
  --shadow-sm:0 2px 8px rgba(15,20,25,.06);
  --shadow-md:0 8px 24px rgba(15,20,25,.10);
  --shadow-lg:0 20px 50px rgba(15,20,25,.20);

  --sidebar-w:258px;
  --header-h:60px;
  --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ -webkit-text-size-adjust:100%; }
body{
  font-family:'Tajawal','Cairo',system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.7;
  font-size:14.5px; min-height:100vh; min-height:100dvh;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
body.no-scroll{ overflow:hidden; }
img{ max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; border:0; background:none; color:inherit; }
input,select,textarea{ font-family:inherit; }
ul{ list-style:none; }

/* =====================================================================
   هيكل اللوحة
   ===================================================================== */
.admin-shell{
  display:grid;
  grid-template-columns:var(--sidebar-w) 1fr;
  min-height:100vh; min-height:100dvh;
}

/* ============ الشريط الجانبي ============ */
.admin-sidebar{
  position:fixed; top:0; right:0; bottom:0;
  width:var(--sidebar-w); background:#fff;
  border-left:1px solid var(--border);
  display:flex; flex-direction:column;
  z-index:60;
  transition:transform .3s var(--ease);
}
.admin-sidebar-head{
  padding:18px 16px 14px;
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:10px;
}
.admin-sidebar-head .brand-mark{
  width:40px; height:40px; border-radius:12px;
  background:var(--green); color:#fff;
  display:grid; place-items:center; font-size:17px;
  flex:0 0 40px;
}
.admin-sidebar-head .brand-text{ min-width:0; }
.admin-sidebar-head .brand-text b{
  display:block; font-size:14px; font-weight:800;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.admin-sidebar-head .brand-text span{
  display:block; font-size:10.5px; color:var(--text-3);
}
.admin-sidebar-close{
  margin-inline-start:auto;
  width:34px; height:34px; border-radius:10px;
  background:var(--bg); color:var(--text-2);
  display:grid; place-items:center; font-size:14px;
  display:none;
}
.admin-sidebar-nav{
  flex:1; overflow-y:auto; padding:12px 10px;
  display:flex; flex-direction:column; gap:3px;
}
.admin-nav-item{
  display:flex; align-items:center; gap:12px;
  width:100%; padding:11px 12px; border-radius:12px;
  font-size:14px; font-weight:700; color:var(--text-2);
  text-align:right; transition:background .18s, color .18s;
}
.admin-nav-item i{
  width:34px; height:34px; flex:0 0 34px;
  border-radius:10px; background:var(--bg);
  color:var(--text-2); display:grid; place-items:center;
  font-size:14px; transition:background .18s, color .18s;
}
.admin-nav-item .nav-badge{
  margin-inline-start:auto;
  background:var(--danger); color:#fff;
  font-size:10.5px; font-weight:800;
  border-radius:var(--radius-pill); padding:1px 8px;
  min-width:20px; text-align:center;
}
.admin-nav-item:hover{ background:var(--bg-2); }
.admin-nav-item.active{ background:var(--green-soft); color:var(--green); }
.admin-nav-item.active i{ background:var(--green); color:#fff; }
.admin-sidebar-foot{
  padding:12px 14px 16px;
  border-top:1px solid var(--border);
  background:var(--bg-2);
}
.admin-user-row{
  display:flex; align-items:center; gap:10px;
  font-size:12px;
}
.admin-user-row .avatar{
  width:34px; height:34px; flex:0 0 34px;
  border-radius:10px; background:var(--green);
  color:#fff; display:grid; place-items:center; font-size:13px;
}
.admin-user-row .info{ flex:1; min-width:0; }
.admin-user-row .info b{
  display:block; font-size:12px; font-weight:700;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.admin-user-row .info span{ display:block; font-size:10.5px; color:var(--text-3); }

/* ============ المنطقة الرئيسية ============ */
.admin-main{
  grid-column:2;
  margin-right:var(--sidebar-w);
  min-width:0;
  display:flex; flex-direction:column;
  min-height:100vh; min-height:100dvh;
}
.admin-topbar{
  position:sticky; top:0; z-index:40;
  height:var(--header-h);
  background:rgba(255,255,255,.94);
  -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; gap:12px;
  padding:0 16px;
}
.topbar-hamburger{
  width:42px; height:42px; border-radius:12px;
  background:var(--green-soft); color:var(--green);
  display:grid; place-items:center; font-size:16px;
  border:1px solid rgba(0,108,53,.14);
  display:none;
}
.topbar-title{
  flex:1; min-width:0;
  font-size:16.5px; font-weight:800; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.topbar-actions{ display:flex; align-items:center; gap:8px; }
.topbar-btn{
  width:38px; height:38px; border-radius:11px;
  background:var(--bg); color:var(--text-2);
  display:grid; place-items:center; font-size:14px;
  border:1px solid var(--border);
  position:relative;
}
.topbar-btn .dot{
  position:absolute; top:6px; right:6px;
  width:9px; height:9px; border-radius:50%;
  background:var(--danger); border:2px solid #fff; display:none;
}
.topbar-btn.has-new .dot{ display:block; }

.admin-content{
  flex:1; padding:20px 18px 40px;
  max-width:1300px; margin:0 auto; width:100%;
}

/* =====================================================================
   الأزرار والحقول والبطاقات
   ===================================================================== */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 16px; border-radius:var(--radius-pill);
  font-size:13px; font-weight:800; white-space:nowrap;
  transition:transform .18s, background .18s, box-shadow .18s, opacity .18s;
}
.btn:active{ transform:scale(.98); }
.btn:disabled{ opacity:.55; cursor:not-allowed; }
.btn-sm{ padding:8px 13px; font-size:12px; }
.btn-primary{ background:var(--green); color:#fff; }
.btn-primary:hover{ background:var(--green-dark); }
.btn-ghost{ background:#fff; color:var(--green); border:1.5px solid rgba(0,108,53,.30); }
.btn-secondary{ background:var(--bg); color:var(--text-2); border:1px solid var(--border); }
.btn-danger{ background:var(--danger-soft); color:var(--danger); border:1px solid rgba(197,48,48,.22); }
.btn-warn{ background:var(--warn-soft); color:var(--warn); border:1px solid rgba(183,121,31,.22); }
.btn-gold{ background:var(--gold-soft); color:#8A6E2F; border:1px solid rgba(200,169,106,.4); }
.btn-block{ width:100%; }

.field{ margin-bottom:14px; }
.field label{
  display:block; font-size:12.5px; font-weight:700; margin-bottom:6px;
  color:var(--text);
}
.field .req{ color:var(--danger); }
.field input,.field select,.field textarea{
  width:100%; padding:11px 13px;
  border:1px solid var(--border); border-radius:var(--radius-sm);
  font-size:13.5px; color:var(--text); background:#fff; outline:none;
  transition:border-color .2s, box-shadow .2s;
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--green); box-shadow:0 0 0 3px rgba(0,108,53,.08);
}
.field textarea{ resize:vertical; min-height:76px; }
.field .hint{ font-size:11px; color:var(--text-3); margin-top:5px; }
.field .error{ font-size:11px; color:var(--danger); margin-top:5px; display:none; }
.field.has-error input,.field.has-error select,.field.has-error textarea{ border-color:var(--danger); }
.field.has-error .error{ display:block; }

.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
@media (max-width:640px){ .field-row{ grid-template-columns:1fr; } }

/* ============ البطاقات ============ */
.card{
  background:#fff; border:1px solid var(--border);
  border-radius:var(--radius); padding:16px;
  box-shadow:var(--shadow-xs);
}
.card + .card{ margin-top:14px; }
.card-head{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; margin-bottom:14px; flex-wrap:wrap;
}
.card-head h3{
  font-size:14.5px; font-weight:800; display:flex; align-items:center; gap:8px;
}
.card-head h3 i{ color:var(--green); }

/* ============ شبكة البطاقات الإحصائية ============ */
.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
  gap:12px; margin-bottom:18px;
}
.stat-card{
  background:#fff; border:1px solid var(--border);
  border-radius:var(--radius); padding:14px;
  display:flex; flex-direction:column; gap:6px;
  box-shadow:var(--shadow-xs);
  transition:transform .18s, box-shadow .18s;
}
.stat-card:hover{ transform:translateY(-2px); box-shadow:var(--shadow-sm); }
.stat-card .ic{
  width:38px; height:38px; border-radius:11px;
  background:var(--green-soft); color:var(--green);
  display:grid; place-items:center; font-size:16px;
}
.stat-card.warn .ic{ background:var(--warn-soft); color:var(--warn); }
.stat-card.danger .ic{ background:var(--danger-soft); color:var(--danger); }
.stat-card.info .ic{ background:var(--info-soft); color:var(--info); }
.stat-card.gold .ic{ background:var(--gold-soft); color:#8A6E2F; }
.stat-card .value{
  font-size:22px; font-weight:800; color:var(--text); line-height:1.2;
}
.stat-card .label{
  font-size:12px; color:var(--text-3); font-weight:600;
}

/* ============ الحالة/الشارات ============ */
.badge{
  display:inline-flex; align-items:center; gap:4px;
  font-size:10.5px; font-weight:800;
  padding:3px 9px; border-radius:var(--radius-pill);
  white-space:nowrap;
}
.badge.draft{ background:var(--bg); color:var(--text-3); }
.badge.pending{ background:var(--warn-soft); color:var(--warn); }
.badge.approved{ background:var(--green-soft); color:var(--green); }
.badge.rejected{ background:var(--danger-soft); color:var(--danger); }
.badge.paid{ background:var(--green-soft); color:var(--green); }
.badge.completed{ background:var(--info-soft); color:var(--info); }
.badge.incomplete{ background:var(--warn-soft); color:var(--warn); }
.badge.partial{ background:var(--warn-soft); color:var(--warn); }
.badge.pending_confirmation{ background:var(--warn-soft); color:var(--warn); }
.badge.confirmed{ background:var(--green-soft); color:var(--green); }
.badge.processing{ background:var(--info-soft); color:var(--info); }
.badge.uploaded{ background:var(--info-soft); color:var(--info); }
.badge.accepted{ background:var(--green-soft); color:var(--green); }
.badge.failed{ background:var(--danger-soft); color:var(--danger); }
.badge.optional{ background:var(--bg); color:var(--text-3); }

/* ============ الجدول ============ */
.table-wrap{
  overflow-x:auto; border-radius:var(--radius); border:1px solid var(--border);
  background:#fff;
}
table.data{
  width:100%; border-collapse:collapse; font-size:13px;
  min-width:640px;
}
table.data th{
  text-align:right; font-size:11.5px; font-weight:800;
  color:var(--text-3); padding:12px 14px;
  background:var(--bg-2);
  border-bottom:1px solid var(--border);
  white-space:nowrap;
}
table.data td{
  padding:12px 14px; border-bottom:1px solid var(--border-2);
  vertical-align:top;
}
table.data tr:last-child td{ border-bottom:0; }
table.data tbody tr:hover{ background:var(--bg-2); cursor:pointer; }
table.data td .cell-title{ font-weight:800; color:var(--text); }
table.data td .cell-sub{ font-size:11.5px; color:var(--text-3); margin-top:2px; }

/* ============ الفلاتر ============ */
.filters{
  display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;
  align-items:center;
}
.filters .search{
  flex:1; min-width:200px; position:relative;
}
.filters .search i{
  position:absolute; top:50%; right:12px; transform:translateY(-50%);
  color:var(--text-3); font-size:13px;
}
.filters .search input{
  width:100%; padding:11px 38px 11px 13px;
  border:1px solid var(--border); border-radius:var(--radius-pill);
  background:#fff; font-size:13px; outline:none;
}
.filters .search input:focus{ border-color:var(--green); }
.filters select{
  padding:11px 13px; border:1px solid var(--border);
  border-radius:var(--radius-pill); font-size:13px;
  background:#fff; outline:none; min-width:150px;
}
.filters .toggle-check{
  display:inline-flex; align-items:center; gap:6px;
  font-size:12.5px; font-weight:700; color:var(--text-2);
  padding:8px 12px; border:1px solid var(--border);
  border-radius:var(--radius-pill); background:#fff; cursor:pointer;
}
.filters .toggle-check input{ accent-color:var(--green); }

/* ============ المبالغ بالعملات ============ */
.price-tri{
  display:inline-flex; flex-wrap:wrap; align-items:baseline; gap:6px;
  font-weight:800; font-size:13px;
}
.price-tri .cur{ color:var(--text); font-size:inherit; font-weight:700; }
.price-tri .sep{ color:var(--text-3); opacity:.6; font-weight:400; }

/* ============ الحالة الفارغة والتحميل ============ */
.empty-state{
  text-align:center; padding:44px 20px; color:var(--text-3);
}
.empty-state i{
  font-size:38px; color:var(--muted,#CBD5E0); display:block; margin-bottom:10px;
}
.empty-state p{ font-size:13.5px; }

.spinner{
  width:38px; height:38px; margin:0 auto 14px;
  border:3px solid var(--green-soft); border-top-color:var(--green);
  border-radius:50%; animation:spin 1s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }
.loading-block{ text-align:center; padding:50px 20px; color:var(--text-3); font-size:13.5px; }

/* ============ نافذة منبثقة ============ */
.modal-overlay{
  position:fixed; inset:0; z-index:200;
  background:rgba(15,25,20,.55);
  -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px);
  display:flex; align-items:center; justify-content:center;
  padding:20px;
  opacity:0; visibility:hidden;
  transition:opacity .25s, visibility .25s;
}
.modal-overlay.open{ opacity:1; visibility:visible; }
.modal-card{
  width:100%; max-width:560px; max-height:92vh;
  background:#fff; border-radius:var(--radius-lg);
  overflow:hidden; display:flex; flex-direction:column;
  box-shadow:var(--shadow-lg);
  transform:translateY(12px) scale(.97);
  transition:transform .25s var(--ease);
}
.modal-overlay.open .modal-card{ transform:none; }
.modal-head{
  display:flex; align-items:center; gap:10px;
  padding:14px 16px;
  background:var(--green); color:#fff;
  flex:0 0 auto;
}
.modal-head.warn{ background:var(--warn); }
.modal-head.danger{ background:var(--danger); }
.modal-head .avatar{
  width:38px; height:38px; border-radius:11px;
  background:rgba(255,255,255,.16);
  display:grid; place-items:center; font-size:16px;
  flex:0 0 38px;
}
.modal-head .title{ flex:1; min-width:0; }
.modal-head .title b{
  display:block; font-size:14px; font-weight:800;
}
.modal-head .title span{ display:block; font-size:11px; opacity:.85; }
.modal-head .close{
  width:34px; height:34px; border-radius:10px;
  background:rgba(255,255,255,.16); color:#fff;
  display:grid; place-items:center; font-size:14px;
  flex:0 0 34px;
}
.modal-body{ padding:16px 18px; overflow-y:auto; flex:1; }
.modal-foot{
  display:flex; gap:10px; padding:14px 18px;
  border-top:1px solid var(--border); background:var(--bg-2);
  flex:0 0 auto; flex-wrap:wrap;
}
.modal-foot .btn{ flex:1; min-width:110px; }

/* ============ Toast ============ */
.toast{
  position:fixed; top:18px; left:50%;
  transform:translateX(-50%) translateY(-130%);
  background:var(--text); color:#fff;
  padding:11px 18px; border-radius:var(--radius-pill);
  font-size:12.5px; font-weight:700;
  box-shadow:var(--shadow-md); z-index:9999;
  transition:transform .3s var(--ease);
  display:inline-flex; align-items:center; gap:8px;
  max-width:92vw;
}
.toast.show{ transform:translateX(-50%) translateY(0); }
.toast.success{ background:#16A34A; }
.toast.warn{ background:var(--warn); }
.toast.error{ background:var(--danger); }

/* ============ تفاصيل الطلب ============ */
.detail-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:10px 18px;
  font-size:13px;
}
.detail-grid .row{
  display:flex; justify-content:space-between; gap:10px;
  padding:8px 0; border-bottom:1px dashed var(--border-2);
}
.detail-grid .row .k{ color:var(--text-3); font-weight:600; }
.detail-grid .row .v{ color:var(--text); font-weight:700; text-align:left; word-break:break-word; }
@media (max-width:640px){ .detail-grid{ grid-template-columns:1fr; } }

.doc-row{
  display:flex; align-items:center; gap:10px; padding:11px 12px;
  background:var(--bg-2); border:1px solid var(--border-2);
  border-radius:12px; margin-bottom:8px;
}
.doc-row.rejected{ background:var(--danger-soft); border-color:rgba(197,48,48,.2); }
.doc-row.accepted{ background:var(--green-soft); border-color:rgba(0,108,53,.2); }
.doc-row .ic{
  width:38px; height:38px; flex:0 0 38px;
  border-radius:11px; background:#fff;
  display:grid; place-items:center; font-size:15px; color:var(--green);
}
.doc-row .body{ flex:1; min-width:0; }
.doc-row .body b{ font-size:13px; font-weight:700; }
.doc-row .body small{ display:block; font-size:11px; color:var(--text-3); margin-top:1px; }
.doc-row .body .reject-note{ color:var(--danger); font-weight:700; }
.doc-row .actions{ display:flex; gap:6px; flex-wrap:wrap; }

.price-table{
  width:100%; font-size:12.5px; border-collapse:collapse;
}
.price-table tr{ border-bottom:1px solid var(--border-2); }
.price-table tr:last-child{ border-bottom:0; }
.price-table td{ padding:9px 4px; vertical-align:top; }
.price-table td:first-child{ color:var(--text-2); }
.price-table td:not(:first-child){ text-align:left; font-weight:700; color:var(--text); }
.price-table tr.total{
  background:var(--green-soft);
}
.price-table tr.total td{ color:var(--green); font-weight:800; font-size:14px; padding:12px 8px; }

.status-history{ display:flex; flex-direction:column; gap:8px; }
.status-history .item{
  display:flex; gap:10px; padding:9px 12px;
  background:var(--bg-2); border:1px solid var(--border-2);
  border-radius:10px; font-size:12.5px;
}
.status-history .item .dot{
  width:8px; height:8px; border-radius:50%;
  background:var(--green); flex:0 0 8px; margin-top:8px;
}
.status-history .item .txt{ flex:1; min-width:0; }
.status-history .item .txt b{ font-weight:800; }
.status-history .item time{
  font-size:11px; color:var(--text-3); white-space:nowrap;
}

/* ============ المحادثات ============ */
.chat-layout{
  display:grid; grid-template-columns:320px 1fr; gap:14px;
  height:calc(100vh - var(--header-h) - 40px); min-height:520px;
}
@media (max-width:900px){ .chat-layout{ grid-template-columns:1fr; height:auto; } }

.chat-list{
  background:#fff; border:1px solid var(--border); border-radius:var(--radius);
  display:flex; flex-direction:column; overflow:hidden;
}
.chat-list-head{
  padding:12px 14px; border-bottom:1px solid var(--border);
  font-size:13.5px; font-weight:800;

function toDate(v){
  if(!v) return null;
  if(v.toDate) return v.toDate();
  if(v instanceof Date) return v;

/* يحوّل مبلغاً بالدولار إلى الدولار والريال والليرة (rates.usdPerSar = دولار لكل ريال، rates.sypPerSar = ليرة لكل ريال) */
function invAmts(usd, rates){
  const u = Number(usd) || 0;
  const sar = u / (rates.usdPerSar || 0.2667);
  const syp = sar * (rates.sypPerSar || 3500);
  return { usd: invNum(u, 2), sar: invNum(Math.round(sar), 0), syp: invNum(Math.round(syp), 0) };
}

function invoiceText(inv){

  const out = [];

  out.push(`رقم الفاتورة: ${inv.invoiceNo}`);

  out.push(`العميل: ${(inv.customer && inv.customer.name) || '—'}`);
  if(inv.customer && inv.customer.phone) out.push(`الهاتف: ${inv.customer.phone}`);
  if(inv.offerName) out.push(`العرض: ${inv.offerName}`);
  out.push('────────────');
  inv.lines.forEach((l,i) => out.push(`${i+1}) ${l.label}${l.note ? ' (' + l.note + ')' : ''}: ${t(l.usd)}`));
  out.push('────────────');
  out.push(`*الإجمالي:* ${t(inv.totalUSD)}`);
  out.push(`المدفوع: ${t(inv.paidUSD)}`);
  out.push(`المتبقي: ${t(inv.remainingUSD)}`);
  out.push(`الحالة: ${inv.status}`);

/* ملف PDF بصفحة واحدة بعرض ضيق (ليس A4): ارتفاع الصفحة بقدر الفاتورة */
async function invPdfBlob(inv){
  const canvas = await invCanvas(inv);
  const { jsPDF } = window.jspdf;
  const pw = 150;
  const ph = Math.max(pw + 1, Math.ceil(canvas.height * pw / canvas.width));
  const pdf = new jsPDF({ unit:'mm', format:[pw, ph], orientation:'portrait' });
  pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, pw, canvas.height * pw / canvas.width);
  return pdf.output('blob');
}

/* waDigits: رقم واتساب المستلم بصيغة دولية بدون + ؛ إن كان فارغاً يختار المستخدم جهة الاتصال */
function wireInvoiceActions(root, getInv, waDigits){
  root.querySelectorAll('[data-inv]').forEach(b => b.addEventListener('click', async () => {
    const act = b.dataset.inv, inv = getInv(), old = b.innerHTML, name = 'فاتورة-' + inv.invoiceNo;
    if(act === 'watext'){ window.open(invWaUrl(waDigits, invoiceText(inv)), '_blank'); return; }
    b.disabled = true; b.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ التجهيز...';
    try {
      if(act === 'img'){
        const c = await invCanvas(inv);
        const blob = await new Promise(r => c.toBlob(r, 'image/png'));
        invDownload(blob, name + '.png'); invToast('تم حفظ الفاتورة كصورة', 'success');
      } else if(act === 'pdf'){
        invDownload(await invPdfBlob(inv), name + '.pdf'); invToast('تم تنزيل الفاتورة PDF', 'success');
      } else if(act === 'wapdf'){
        const blob = await invPdfBlob(inv);
        const file = new File([blob], name + '.pdf', { type:'application/pdf' });
        let shared = false;
        if(navigator.canShare && navigator.canShare({ files:[file] })){
          try { await navigator.share({ files:[file], text: inv.title + ' ' + inv.invoiceNo }); shared = true; }
          catch(e){ if(e && e.name === 'AbortError') shared = true; }
        }
        if(!shared){
          invDownload(blob, name + '.pdf');
          window.open(invWaUrl(waDigits, `مرفق ملف الفاتورة ${inv.invoiceNo} (PDF).`), '_blank');
          invToast('تم تنزيل الملف. أرفقه في محادثة واتساب', 'success');
        }
      }
    } catch(e){ console.error('[invoice]', e); invToast('تعذّر تجهيز الفاتورة. تحقق من الاتصال وحاول مجدداً', 'error'); }
    finally { b.disabled = false; b.innerHTML = old; }
  }));
}

function confirmDialog({ title, message, confirmText = 'تأكيد', cancelText = 'إلغاء', danger = false }){
  return new Promise((resolve) => {
    const overlay = document.getElementById('modalOverlay');
    const card = document.getElementById('modalCard');
    card.innerHTML = `
      <div class="modal-head ${danger?'danger':''}">
        <div class="avatar"><i class="fa-solid ${danger?'fa-triangle-exclamation':'fa-circle-question'}"></i></div>
        <div class="title">
          <b>${esc(title||'تأكيد')}</b>
          <span>يرجى التأكيد للمتابعة</span>
        </div>
        <button class="close" data-act="cancel"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <p style="font-size:13.5px;line-height:1.9;">${esc(message||'')}</p>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-act="cancel">${esc(cancelText)}</button>
        <button class="btn ${danger?'btn-danger':'btn-primary'}" data-act="ok">${esc(confirmText)}</button>
      </div>
    `;
    function close(val){
      overlay.classList.remove('open');
      document.body.classList.remove('no-scroll');
      document.removeEventListener('keydown', onKey);
      resolve(val);
    }
    function onKey(e){ if(e.key === 'Escape') close(false); }
    card.querySelectorAll('[data-act="cancel"]').forEach(el => el.addEventListener('click', ()=>close(false)));
    card.querySelector('[data-act="ok"]').addEventListener('click', ()=>close(true));
    overlay.addEventListener('click', e => { if(e.target === overlay) close(false); }, {once:true});
    document.addEventListener('keydown', onKey);
    overlay.classList.add('open');
    document.body.classList.add('no-scroll');
  });
}

/* نافذة مخصصة عامة */
function openModal({ title, sub, bodyHtml, actions, head='default' }){
  const overlay = document.getElementById('modalOverlay');
  const card = document.getElementById('modalCard');
  card.innerHTML = `
    <div class="modal-head ${head!=='default'?head:''}">
      <div class="avatar"><i class="fa-solid fa-circle-info"></i></div>
      <div class="title">
        <b>${esc(title||'')}</b>
        <span>${esc(sub||'')}</span>
      </div>
      <button class="close" data-close="1"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">${bodyHtml||''}</div>
    ${actions ? `<div class="modal-foot">${actions}</div>` : ''}
  `;
  function close(){
    overlay.classList.remove('open');
    document.body.classList.remove('no-scroll');
  }
  card.querySelectorAll('[data-close]').forEach(el => el.addEventListener('click', close));
  overlay.addEventListener('click', e => { if(e.target === overlay) close(); }, {once:true});
  overlay.classList.add('open');
  document.body.classList.add('no-scroll');
  return { close, card };
}

  });

  const unsubQuota = onSnapshot(doc(db,'settings','westernUnionQuota'), dq => {
    const wrap = document.getElementById('quotaBody');
    if(!wrap) return;
    const data = dq.exists() ? dq.data() : {};
    const count = Number(data.count)||0;
    const resetAt = Number(data.resetAt)||0;
    getDoc(doc(db,'settings','payment')).then(ps => {
      const limitVal = Number(ps.exists() ? (ps.data().westernUnion?.dailyLimit||2) : 2);
      const now = Date.now();
      const dayMs = 24*60*60*1000;
      const isReset = (now - resetAt) > dayMs;
      const effectiveCount = isReset ? 0 : count;
      const remainingMs = isReset ? 0 : Math.max(0, resetAt + dayMs - now);
      const h = Math.floor(remainingMs / (60*60*1000));
      const m = Math.floor((remainingMs % (60*60*1000)) / 60000);

          confirmText:'تصفير', danger:true
        });

        try {
          await setDoc(doc(db,'settings','westernUnionQuota'), { count:0, resetAt: Date.now() }, { merge:true });

        } catch(e){ console.error(e); toast('تعذّر التصفير','error'); }
      });

    console.warn('[quota]', err);
    const wrap = document.getElementById('quotaBody');

    let unread = 0;
    snap.forEach(d => { unread += Number(d.data().unreadForAdmin||0); });

    setDashCard('pendingPay', snap.size);
  }, err => console.warn('[dashPay]', err));

  STATE.apps.unsub = () => { unsubApps(); unsubRecent(); unsubQuota(); unsubChats(); unsubVoice(); unsubPay(); };
}

async function reloadAppsList(){
  STATE.apps.items = [];

}

async function loadMoreApps(){
  if(STATE.apps.loading) return;
  STATE.apps.loading = true;
  const wrap = document.getElementById('appsListWrap');
  if(!wrap) return;
  if(STATE.apps.items.length === 0){
    wrap.innerHTML = '<div class="loading-block"><div class="spinner"></div>جارٍ التحميل...</div>';
  }

  try {
    const PAGE = 30;
    const q = query(collection(db,'applications'), orderBy('updatedAt','desc'), limit(PAGE));

    let ref = q;
    if(STATE.apps.lastDoc){
      ref = query(collection(db,'applications'), orderBy('updatedAt','desc'), startAfter(STATE.apps.lastDoc), limit(PAGE));
    }
    const snap = await getDocs(ref);
    let list = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    STATE.apps.lastDoc = snap.docs[snap.docs.length-1] || null;
    STATE.apps.hasMore = snap.size === PAGE;

    if(STATE.apps.filterStatus) list = list.filter(a => a.status === STATE.apps.filterStatus);
    if(STATE.apps.filterPayment) list = list.filter(a => a.paymentStatus === STATE.apps.filterPayment);
    if(!STATE.apps.includeDrafts) list = list.filter(a => a.status !== 'draft');
    const term = (STATE.apps.search||'').toLowerCase();
    if(term){
      list = list.filter(a => {
        const p = a.personal || {};
        const hay = [
          a.customerName, a.customerPhone, a.trackingId,
          p.nationalId, p.passportNumber, p.name,
          a.offerName, a.offerId
        ].filter(Boolean).join(' ').toLowerCase();
        return hay.includes(term);
      });
    }

    list.forEach(a => STATE.appsCache.set(a.id, a));

    STATE.apps.items = STATE.apps.items.concat(list);
    renderAppsList();

    const btn = document.getElementById('appsLoadMore');
    if(btn) btn.style.display = STATE.apps.hasMore ? 'inline-flex' : 'none';
  } catch(err){
    console.error('[loadMoreApps]', err);
    if(wrap) wrap.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><p>تعذّر تحميل الطلبات. ${esc(err.code === 'permission-denied' ? 'صلاحيات Firestore مرفوضة.' : '')}</p></div>`;
  } finally {
    STATE.apps.loading = false;
  }
}

function renderDocsList(container, app){
  const docs = app.documents || {};
  const present = DOC_KEYS.filter(k => docs[k] && (docs[k].url || docs[k].status));
  if(!present.length){
    container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-folder-open"></i><p>لا مستندات مرفوعة.</p></div>';
    return;
  }
  container.innerHTML = '';
  present.forEach(key => {
    const d = docs[key];
    const row = document.createElement('div');
    row.className = 'doc-row ' + (d.status === 'rejected' ? 'rejected' : d.status === 'accepted' ? 'accepted' : '');
    row.innerHTML = `
      <div class="ic"><i class="fa-solid ${docIcon(key)}"></i></div>
      <div class="body">
        <b>${esc(docLabel(key))}</b>
        <small>${esc(d.name||'')}</small>
        ${d.status ? `<small><span class="badge ${esc(d.status)}">${esc(statusLabel(d.status))}</span></small>` : ''}
        ${d.rejectReason ? `<small class="reject-note">سبب الرفض: ${esc(d.rejectReason)}</small>` : ''}
        <small>${d.uploadedAt ? esc(fmtDateTimeAr(d.uploadedAt)) : ''}</small>
      </div>
      <div class="actions">
        ${d.url ? `<a class="btn btn-secondary btn-sm" href="${esc(d.url)}" target="_blank" rel="noopener noreferrer">
          <i class="fa-solid fa-eye"></i> عرض
        </a>` : ''}
        <button class="btn btn-primary btn-sm" data-doc-ok="${esc(key)}"><i class="fa-solid fa-check"></i> قبول</button>
        <button class="btn btn-danger btn-sm" data-doc-rej="${esc(key)}"><i class="fa-solid fa-xmark"></i> رفض</button>
      </div>
    `;
    row.querySelector(`[data-doc-ok="${CSS.escape(key)}"]`)?.addEventListener('click', () => acceptDoc(app.__id, key));
    row.querySelector(`[data-doc-rej="${CSS.escape(key)}"]`)?.addEventListener('click', () => rejectDoc(app.__id, key));
    container.appendChild(row);

}

function renderPriceTable(container, ps){
  const rows = [];
  const add = (k, v) => { if(v!=null && v!==0) rows.push([k, v]); };
  add('رسوم الخدمة', ps.serviceFee);

  add('تكاليف العقد', ps.contractFee);
  if(ps.visaFee) add('رسوم الفيزا', ps.visaFee);
  if(ps.ticketFee) add('تذكرة السفر', ps.ticketFee);
  if(ps.papersFee) add('تكاليف الأوراق', ps.papersFee);

/* =====================================================================
   ملف الدفعات (للمشرف فقط) — الدفعة الأولى + الدفعات المسجَّلة + باقي الدفعات
   ملاحظة: يجب أن تطابق هذه الأرقام DOC_FEES في index.html
   ===================================================================== */
const DOC_FEES = {
  base: [
    { key:'applicationFee', label:'رسوم تقديم الطلب',       usd:60 },
    { key:'reviewFee',      label:'مراجعة وتصديق الوثائق',  usd:45 },
    { key:'prepFee',        label:'إعداد الملف ومتابعته',    usd:30 },
  ],
  extraPerDoc: { driverLicense:8, education:10, practice:15 }
};
function adminFees(a){
  if(a.docFees && a.docFees.items){
    const items = Array.isArray(a.docFees.items) ? a.docFees.items : Object.values(a.docFees.items);
    const extras = a.docFees.extras ? (Array.isArray(a.docFees.extras) ? a.docFees.extras : Object.values(a.docFees.extras)) : [];
    return { items, extras, totalUSD: Number(a.docFees.totalUSD) || (items.concat(extras).reduce((t,i)=>t+(Number(i.usd)||0),0)) };
  }
  const docs = a.documents || {};
  const items = DOC_FEES.base.map(i => ({ ...i }));
  const extras = Object.keys(DOC_FEES.extraPerDoc).filter(k => docs[k] && (docs[k].url || docs[k].status))
    .map(k => ({ key:k, label:docLabel(k), usd:DOC_FEES.extraPerDoc[k] }));
  return { items, extras, totalUSD: items.concat(extras).reduce((t,i)=>t+i.usd,0) };
}
function fxRates(){ return (STATE.settings.fx?.rates || DEFAULT_FX.rates); }
function usdRate(){ return (fxRates().USD || {}).rate || 0.2667; }
const PAY_METHOD_LABELS = { cliq:'كليك CliQ', western:'حوالة / ويسترن', bank:'تحويل بنكي', other:'أخرى' };


/* ---------- فواتير الأدمن: نفس الفاتورة التي يراها العميل ---------- */
function adminInvRates(){ const r = fxRates(); return { usdPerSar: (r.USD || {}).rate || 0.2667, sypPerSar: (r.SYP || {}).rate || 3500 }; }
function adminInvBase(a, appId){
  const c = STATE.settings.company || {};
  return {
    company: c.name || 'منصة قوى ـ وزارة التنمية البشرية',
    invoiceNo: 'INV-' + String(appId).slice(-6).toUpperCase(),
    customer: { name: a.customerName || '', phone: a.customerPhone || '' },
    offerName: a.offerName || '',
    rates: adminInvRates(),
    fxNote: STATE.settings.fx && STATE.settings.fx.lastUpdated ? 'أسعار الصرف محدثة بتاريخ ' + STATE.settings.fx.lastUpdated : ''
  };
}
function buildFirstInvoice(a, appId, fees, pays){
  const rate = usdRate();
  const confirmed = pays.filter(p => p.status === 'confirmed');
  const paid = confirmed.reduce((t,p) => t + (p.amountUSD != null ? Number(p.amountUSD) : (Number(p.amount)||0) * rate), 0);
  const total = fees.totalUSD;
  const remaining = Math.max(0, Math.round((total - paid) * 100) / 100);
  return {
    ...adminInvBase(a, appId),
    title: 'فاتورة رسمية — الدفعة الأولى', subtitle: 'رسوم المستندات',
    date: fmtDateAr(a.createdAt),
    lines: fees.items.map(i => ({ label: i.label, usd: Number(i.usd) || 0 }))
      .concat(fees.extras.map(e => ({ label: e.label, note: 'مستند إضافي', usd: Number(e.usd) || 0 }))),
    totalUSD: total, paidUSD: Math.min(paid, total), remainingUSD: remaining,
    status: remaining < 1 ? 'مسدَّدة' : (paid > 0 ? 'مدفوعة جزئياً' : 'بانتظار الدفع'),
    payments: confirmed.map(p => ({
      label: [methodLabel(p.method), p.invoiceNumber, fmtDateAr(p.createdAt)].filter(Boolean).join(' · '),
      usd: p.amountUSD != null ? Number(p.amountUSD) : (Number(p.amount) || 0) * rate
    }))
  };
}
/* idx = رقم بند واحد، أو null لكل الدفعات اللاحقة */
function buildLaterInvoice(a, appId, later, idx){
  const items = idx == null ? later : [later[idx]];
  const total = items.reduce((t,x) => t + x.usd, 0);
  const paid = items.filter(x => x.paid).reduce((t,x) => t + x.usd, 0);
  const remaining = Math.max(0, Math.round((total - paid) * 100) / 100);
  const base = adminInvBase(a, appId);
  return {
    ...base,
    invoiceNo: base.invoiceNo + (idx == null ? '-D' : '-D' + (idx + 2)),
    title: idx == null ? 'فاتورة رسمية — الدفعات اللاحقة' : 'فاتورة رسمية — ' + items[0].label,
    subtitle: idx == null ? '' : 'الدفعة رقم ' + (idx + 2),
    date: fmtDateAr(new Date()),
    lines: items.map(x => ({ label: x.label, note: x.paid ? 'مسدَّد' : '', usd: x.usd })),
    totalUSD: total, paidUSD: paid, remainingUSD: remaining,
    status: remaining < 1 ? 'مسدَّدة' : (paid > 0 ? 'مدفوعة جزئياً' : 'بانتظار الدفع'),
    payments: []
  };
}
/* رقم واتساب العميل بصيغة دولية بدون + (يحذف الصفر الأول من الرقم المحلي) */
function custWaDigits(a){
  const p = a.personal || {};
  const cc = String(p.phoneCountry || '').replace(/\D/g, '');
  const local = String(p.phone || '').replace(/\D/g, '').replace(/^0+/, '');
  if(cc && local) return cc + local;
  let d = String(a.customerPhone || '').replace(/\D/g, '');
  if(d.startsWith('00')) d = d.slice(2);
  return d;
}

  ov.innerHTML = `<div style="max-width:830px;margin:0 auto;">

    </div>
    <div class="inv-stage">${invoiceSheetHTML(inv)}${invActionsHTML()}</div>
  </div>`;
  document.body.appendChild(ov);
  const onKey = e => { if(e.key === 'Escape') close(); };
  const close = () => { ov.remove(); document.removeEventListener('keydown', onKey); };
  document.addEventListener('keydown', onKey);
  ov.addEventListener('click', e => { if(e.target === ov) close(); });
  ov.querySelector('#invClose').addEventListener('click', close);
  wireInvoiceActions(ov, () => inv, waDigits);
}

/* =====================================================================
   مراجعة خطوات التقديم (كل خطوة تُقبل أو تُرفض على حدة)
   applications/{id}.steps.s1..s4 = { status:'processing'|'approved'|'rejected', note, submittedAt, reviewedAt }
   الخطوة 2 (البيانات) والخطوة 3 (المستندات) تُراجَع كل واحدة على حدة؛ rev = رقم الإرسال (2+ = معدّل)
   الخطوة 1 و4 بدون مراجعة: الخطوة 4 => status='approved' => ينتقل الزبون تلقائياً لصفحة الدفع
   ===================================================================== */
/* ---- مراجعة الطلب داخل بطاقة العميل: قبول/رفض كل خانة وكل مستند على حدة ----
   applications/{id}.fieldReview.{key} = { status:'accepted'|'rejected'|'pending', reason }
   applications/{id}.documents.{key}.status = 'uploaded'|'accepted'|'rejected' , rejectReason
   الطلب كله يصل مرة واحدة (status='pending' + submittedAt) بدون موافقات خطوة خطوة */
const REVIEW_FIELDS = [
  ['name','الاسم'], ['nationalId','الرقم الوطني'], ['passportNumber','رقم الجواز'], ['passportIssue','إصدار الجواز'],
  ['passportExpiry','انتهاء الجواز'], ['birthDate','تاريخ الميلاد'], ['nationality','الجنسية'], ['gender','الجنس'],
  ['maritalStatus','الحالة الاجتماعية'], ['phone','الهاتف'], ['email','البريد'], ['city','المدينة'],
  ['profession','المهنة'], ['education','المؤهل']
];
const GENDER_AR = { male:'ذكر', female:'أنثى' };
const MARITAL_AR = { single:'أعزب', married:'متزوج', divorced:'مطلّق', widowed:'أرمل' };
const EDU_AR = { none:'بدون', primary:'ابتدائي', middle:'إعدادي', secondary:'ثانوي', diploma:'دبلوم', bachelor:'بكالوريوس', master:'ماجستير', phd:'دكتوراه' };
function fieldValue(p, k){
  p = p || {};
  if(k === 'phone') return ((p.phoneCountry||'') + ' ' + (p.phone||'')).trim();
  if(k === 'gender') return GENDER_AR[p.gender] || p.gender || '';
  if(k === 'maritalStatus') return MARITAL_AR[p.maritalStatus] || p.maritalStatus || '';
  if(k === 'education') return EDU_AR[p.education] || p.education || '';
  return p[k] || '';
}
function reviewCounts(a){
  const p = a.personal || {}, fr = a.fieldReview || {}, docs = a.documents || {};
  const c = { fOk:0, fRej:0, fPen:0, dOk:0, dRej:0, dPen:0 };
  REVIEW_FIELDS.forEach(([k]) => {
    if(!fieldValue(p, k)) return;
    const st = (fr[k] || {}).status;
    if(st === 'accepted') c.fOk++; else if(st === 'rejected') c.fRej++; else c.fPen++;
  });
  DOC_KEYS.forEach(k => {
    const d = docs[k]; if(!d || !d.url) return;
    if(d.status === 'accepted') c.dOk++; else if(d.status === 'rejected') c.dRej++; else c.dPen++;
  });
  return c;
}
/* ---- حالة كل خطوة: todo | filling | review | rejected | done ---- */
function stepState(a, n){
  const st = a.steps || {};
  const legacy = a.status === 'pending' && !a.steps && (a.submittedAt);   /* طلبات قديمة أُرسلت دفعة واحدة */
  if(n === 1) return (a.status === 'draft' && !(Number(a.currentStep) >= 2) && !a.steps) ? 'filling' : 'done';
  if(n === 2 || n === 3){
    const s = st['s' + n];
    if(s && s.status === 'processing') return 'review';
    if(s && s.status === 'rejected') return 'rejected';
    if(s && s.status === 'approved') return 'done';
    if(legacy) return 'review';
    if(['approved','paid','completed'].includes(a.status)) return 'done';
    if(n === 2) return 'filling';
    return stepState(a, 2) === 'done' ? 'filling' : 'todo';
  }
  /* الخطوة 4: التأكيد والدفع */
  if(a.paymentStatus === 'confirmed' || ['paid','completed'].includes(a.status)) return 'done';
  if(a.paymentStatus === 'pending_confirmation') return 'review';
  if(a.status === 'approved') return 'filling';
  return stepState(a, 3) === 'done' ? 'filling' : 'todo';
}
const STEP_TITLES = { 1:'العرض والإضافات', 2:'بيانات المتقدم', 3:'المستندات', 4:'التأكيد والدفع' };
function stepStateLabel(a, n){
  const s = stepState(a, n);
  if(n === 4){
    if(s === 'done') return ['تم الدفع','approved'];
    if(s === 'review') return ['إيصال بانتظار المراجعة','pending'];
    if(s === 'filling') return ['بانتظار الدفع','optional'];
    return ['لم يبدأ','optional'];
  }
  if(n === 1) return s === 'done' ? ['تم','approved'] : ['العميل يعبّئ','optional'];
  return ({
    todo:['لم يبدأ','optional'], filling:['العميل يعبّئ','optional'],
    review:['بانتظار مراجعتك','pending'], rejected:['بانتظار تعديل العميل','rejected'], done:['تمت الموافقة','approved']
  })[s];
}
function editCountOf(a){
  const s = a.steps || {};
  return Math.max(0, ((s.s2 && s.s2.rev) || 0) - 1) + Math.max(0, ((s.s3 && s.s3.rev) || 0) - 1);
}
function editBadge(a){ const n = editCountOf(a); return n ? `<span class="badge incomplete edit-badge">معدّل (${n})</span>` : ''; }
function miniTracker(a){ return `<span class="mini-trk">${[1,2,3,4].map(n => `<i class="${stepState(a, n)}"></i>`).join('')}</span>`; }
function trackerHTML(a){
  const titles = ['العرض','البيانات','المستندات','الدفع'];
  return `<div class="trk">${[1,2,3,4].map(n => {
    const s = stepState(a, n);
    const ic = s === 'done' ? '<i class="fa-solid fa-check"></i>' : s === 'rejected' ? '<i class="fa-solid fa-xmark"></i>' : s === 'review' ? '<i class="fa-solid fa-hourglass-half"></i>' : n;
    return `<div class="trk-i ${s}"><span class="trk-dot">${ic}</span><small>${titles[n-1]}</small></div>`;
  }).join('')}</div>`;
}
function stepBadge(a){
  if(a.status === 'rejected') return 'مرفوض';
  if(['paid','completed'].includes(a.status)) return 'مكتمل — الدفع';
  if(a.paymentStatus === 'pending_confirmation') return 'إيصال دفع بانتظار المراجعة';
  if(a.status === 'approved') return 'بانتظار الدفع';
  const s2 = stepState(a, 2), s3 = stepState(a, 3);
  if(s3 === 'review') return 'خطوة 3: مستندات بانتظار المراجعة';
  if(s2 === 'review') return 'خطوة 2: بيانات بانتظار المراجعة';
  if(s3 === 'rejected') return 'خطوة 3: بانتظار تعديل العميل';
  if(s2 === 'rejected') return 'خطوة 2: بانتظار تعديل العميل';
  if(s3 === 'done') return 'خطوة 4: العميل يؤكد الطلب';
  if(s3 === 'filling') return 'خطوة 3: العميل يرفع المستندات';
  if(a.status === 'draft' && stepState(a, 1) === 'filling') return 'خطوة 1: مسودة';
  return 'خطوة 2: العميل يعبّئ البيانات';
}
function custAvatar(a, size){
  const u = a.documents && a.documents.personalPhoto && a.documents.personalPhoto.url;
  const st = `width:${size}px;height:${size}px;border-radius:50%;flex:none;border:1px solid var(--border);`;
  return u ? `<img src="${esc(u)}" alt="" style="${st}object-fit:cover;">`

}
function stepSummaryHTML(a, n){
  const c = reviewCounts(a);
  const line = (ok, rej, pen) => `<b style="color:#16a34a">${ok} مقبول</b> · <b style="color:#dc2626">${rej} مرفوض</b> · <b style="color:#d97706">${pen} بانتظار المراجعة</b>`;
  const [ok, rej, pen] = n === 2 ? [c.fOk, c.fRej, c.fPen] : [c.dOk, c.dRej, c.dPen];
  return `<div style="font-size:12.5px;line-height:2.1">${line(ok, rej, pen)}
    <div style="color:var(--text-3);font-size:11.5px;margin-top:2px">راجع كل عنصر (قبول / رفض مع السبب) ثم اضغط «إرجاع للتعديل» لإرسال المرفوض فقط للعميل، أو «موافقة على الخطوة» لنقله للخطوة التالية.</div></div>`;
}
function stepHeadInner(a, n){
  const [txt, cls] = stepStateLabel(a, n);
  return `<span class="step-num ${stepState(a, n)}">${n}</span><span class="step-title">${esc(STEP_TITLES[n])}</span>
    <span class="badge ${cls}">${esc(txt)}</span><i class="fa-solid fa-chevron-down step-chev"></i>`;
}
function activeStepOf(a){
  for(const n of [2,3,4]) if(stepState(a, n) === 'review') return n;
  for(const n of [2,3]) if(stepState(a, n) === 'rejected') return n;
  for(const n of [1,2,3,4]) if(stepState(a, n) === 'filling') return n;
  return 4;
}
function paintReviewSummary(appId){
  const a = STATE.appsCache.get(appId); if(!a) return;

  [2,3].forEach(n => { const s = document.getElementById('stepSum' + n); if(s) s.innerHTML = stepSummaryHTML(a, n); });
}

function isFullyApproved(a){
  return !!a && stepState(a, 2) === 'done' && stepState(a, 3) === 'done' && ['approved','paid','completed'].includes(a.status);
}
function cvAge(birth){
  const d = birth ? new Date(birth) : null;
  if(!d || isNaN(d)) return '';
  const now = new Date();
  let age = now.getFullYear() - d.getFullYear();
  const m = now.getMonth() - d.getMonth();
  if(m < 0 || (m === 0 && now.getDate() < d.getDate())) age--;
  return age >= 0 && age < 120 ? String(age) : '';
}
/* الصورة الشخصية كـ data URL (الملفات مخزّنة base64 في files/{id}) */
async function cvPhotoDataUrl(a){
  const u = a.documents && a.documents.personalPhoto && a.documents.personalPhoto.url;
  if(!u) return '';
  try {
    if(u.startsWith('rtdb-file:')){
      const s = await _get(_ref(db, 'files/' + u.slice(10)));
      const v = s.val();
      return v && v.data && String(v.type || v.data).includes('image') ? v.data : '';
    }
    if(u.startsWith('data:')) return u;
    const blob = await (await fetch(u)).blob();
    return await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.onerror = () => r(''); fr.readAsDataURL(blob); });
  } catch(e){ console.warn('[cv photo]', e); return ''; }
}

function ensureCvStyles(){
  if(document.getElementById('cvStyles')) return;
  const st = document.createElement('style'); st.id = 'cvStyles'; st.textContent = CV_CSS; document.head.appendChild(st);
}
const CV_QUAL_KEYS = ['education','practice','experience','driverLicense','cv'];
const CV_OFFICIAL_KEYS = ['passport','nationalId','criminalRecord','vaccination','maritalStatus'];
function cvDocRows(a, keys){
  const docs = a.documents || {};
  const rows = keys.filter(k => docs[k] && docs[k].url).map((k, i) => {
    const ok = docs[k].status === 'accepted';
    return `<div class="cv-doc"><span class="n">${i+1}</span><span class="t">${esc(docLabel(k))}${docs[k].name ? ` <small>(${esc(docs[k].name)})</small>` : ''}</span><span class="s">${ok ? '✔ تمت الموافقة' : 'قيد المراجعة'}</span></div>`;
  });
  return rows.length ? rows.join('') : '<div class="cv-empty">— لا يوجد —</div>';
}
function cvDate(v){
  try {
    const d = v && typeof v.toDate === 'function' ? v.toDate() : new Date(v);
    return isNaN(d) ? '' : d.toLocaleDateString('en-GB');
  } catch(e){ return ''; }
}

async function cvCanvas(a){
  ensureCvStyles();
  await invEnsureLibs();
  const photo = await cvPhotoDataUrl(a);
  const host = document.createElement('div');
  host.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;background:#fff;';
  host.innerHTML = cvSheetHTML(a, photo);
  document.body.appendChild(host);
  try {
    await invLoadFonts();
    const img = host.querySelector('.cv-photo img');
    if(img && !img.complete) await new Promise(r => { img.onload = img.onerror = r; });
    return await window.html2canvas(host.firstElementChild, { scale:2, backgroundColor:'#ffffff', useCORS:true });
  } finally { host.remove(); }
}
async function cvPdfBlob(a){
  const canvas = await cvCanvas(a);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit:'mm', format:'a4' });
  const pw = 210, ph = 297;
  const pageHpx = Math.floor(canvas.width * ph / pw);
  let y = 0, first = true;
  while(y < canvas.height){
    const sh = Math.min(pageHpx, canvas.height - y);
    const part = document.createElement('canvas'); part.width = canvas.width; part.height = sh;
    const ctx = part.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, part.width, sh);
    ctx.drawImage(canvas, 0, y, canvas.width, sh, 0, 0, canvas.width, sh);
    if(!first) pdf.addPage();
    pdf.addImage(part.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, pw, sh * pw / canvas.width);
    y += sh; first = false;
  }
  return pdf.output('blob');
}
async function cvLatestApp(appId){
  let a = STATE.appsCache.get(appId);
  try { const fs = await getDoc(doc(db,'applications',appId)); if(fs.exists()){ a = fs.data(); a.__id = appId; STATE.appsCache.set(appId, a); } } catch(e){}
  return a;
}
async function openCvPdf(appId, mode, btn){
  const old = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جارٍ التجهيز...'; }
  try {
    const a = await cvLatestApp(appId);
    if(!a) throw new Error('الطلب غير موجود');
    if(!isFullyApproved(a)){ toast('الملف يتوفر بعد الموافقة على الخطوات الأربع','warn'); return; }
    const blob = await cvPdfBlob(a);
    const nm = 'ملف-' + (((a.personal||{}).name || a.customerName || appId)).replace(/[\\/:*?"<>|]/g,'').trim();
    if(mode === 'view'){
      const url = URL.createObjectURL(blob);
      const w = window.open(url, '_blank');
      if(!w) invDownload(blob, nm + '.pdf');
      setTimeout(() => URL.revokeObjectURL(url), 60000);
    } else invDownload(blob, nm + '.pdf');
  } catch(e){ console.error('[cv pdf]', e); toast('تعذّر تجهيز ملف PDF. تحقق من الاتصال وحاول مجدداً','error'); }
  finally { if(btn){ btn.disabled = false; btn.innerHTML = old; } }
}

  if(!isFullyApproved(a)) return '';
  return `<div style="margin-top:12px;padding:12px;border:1px dashed #16a34a;border-radius:12px;background:rgba(22,163,74,.06);display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
    <b style="font-size:13px;flex:1;min-width:160px;"><i class="fa-solid fa-file-circle-check" style="color:#16a34a"></i> ملف العميل المعتمد (PDF مختوم)</b>
    <button class="btn btn-secondary btn-sm" data-cvpdf="view"><i class="fa-solid fa-eye"></i> عرض</button>
    <button class="btn btn-primary btn-sm" data-cvpdf="download"><i class="fa-solid fa-file-pdf"></i> تحميل PDF</button>
  </div>`;
}

/* بيانات المتقدم: كل خانة لها قبول/رفض */
function fieldRowHTML(a, k, label){
  const v = fieldValue(a.personal, k);
  const r = (a.fieldReview || {})[k] || {};
  const badge = r.status === 'accepted' ? '<span class="badge approved">مقبول</span>'
              : r.status === 'rejected' ? '<span class="badge rejected">مرفوض</span>'
              : (v ? '<span class="badge pending">بانتظار المراجعة</span>' : '');
  return `<span class="k">${esc(label)}</span><span class="v" style="flex:1">${esc(v || '—')}</span>
    ${v ? `<span style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">${badge}
      <button class="btn btn-primary btn-sm" data-f-ok="${esc(k)}"><i class="fa-solid fa-check"></i></button>
      <button class="btn btn-danger btn-sm" data-f-rej="${esc(k)}"><i class="fa-solid fa-xmark"></i></button></span>` : ''}
    ${r.status === 'rejected' && r.reason ? `<small style="flex-basis:100%;color:var(--danger);font-weight:700">سبب الرفض: ${esc(r.reason)}</small>` : ''}`;
}
function paintFieldRow(appId, k){
  const a = STATE.appsCache.get(appId); if(!a) return;
  const row = document.querySelector(`#personalRows [data-fkey="${CSS.escape(k)}"]`); if(!row) return;
  const label = (REVIEW_FIELDS.find(x => x[0] === k) || [k,k])[1];
  row.innerHTML = fieldRowHTML(a, k, label);
  bindFieldRow(appId, row);
}
function bindFieldRow(appId, row){
  const k = row.dataset.fkey;
  row.querySelector('[data-f-ok]')?.addEventListener('click', () => reviewField(appId, k, 'accepted'));
  row.querySelector('[data-f-rej]')?.addEventListener('click', () => reviewField(appId, k, 'rejected'));
}
function renderPersonalRows(el, a){
  el.innerHTML = '';
  REVIEW_FIELDS.forEach(([k, label]) => {
    const row = document.createElement('div');
    row.className = 'row'; row.dataset.fkey = k;
    row.style.cssText = 'flex-wrap:wrap;align-items:center;';
    row.innerHTML = fieldRowHTML(a, k, label);
    bindFieldRow(a.__id, row);
    el.appendChild(row);
  });
}
async function reviewField(appId, k, status){
  const a = STATE.appsCache.get(appId); if(!a) return;
  let reason = '';
  if(status === 'rejected'){
    const label = (REVIEW_FIELDS.find(x => x[0] === k) || [k,k])[1];
    reason = await askRejectReason({ title:'رفض المعلومة', sub: label, reasons: REJECT_REASONS_INFO });
    if(!reason) return;
  }
  try {
    await updateDoc(doc(db,'applications',appId), { [`fieldReview.${k}`]: { status, reason }, updatedAt: serverTimestamp() });
    a.fieldReview = Object.assign({}, a.fieldReview || {}, { [k]: { status, reason } });
    paintFieldRow(appId, k); paintReviewSummary(appId);
  } catch(e){ console.error(e); toast('تعذّر الحفظ','error'); }
}
async function acceptAllFields(appId){
  const a = STATE.appsCache.get(appId); if(!a) return;
  const upd = { updatedAt: serverTimestamp() }, fr = Object.assign({}, a.fieldReview || {});
  REVIEW_FIELDS.forEach(([k]) => {
    if(!fieldValue(a.personal, k) || (fr[k] || {}).status === 'rejected') return;
    upd[`fieldReview.${k}`] = { status:'accepted', reason:'' }; fr[k] = { status:'accepted', reason:'' };
  });
  try {
    await updateDoc(doc(db,'applications',appId), upd);
    a.fieldReview = fr;
    renderPersonalRows(document.getElementById('personalRows'), a); paintReviewSummary(appId);
    toast('تم قبول البيانات غير المرفوضة','success');
  } catch(e){ console.error(e); toast('تعذّر الحفظ','error'); }
}
async function acceptAllDocs(appId){
  const a = STATE.appsCache.get(appId); if(!a) return;
  const upd = { updatedAt: serverTimestamp() }, docs = a.documents || {};
  DOC_KEYS.forEach(k => {
    const d = docs[k]; if(!d || !d.url || d.status === 'rejected') return;
    upd[`documents.${k}.status`] = 'accepted'; upd[`documents.${k}.rejectReason`] = ''; d.status = 'accepted'; d.rejectReason = '';
  });
  try {
    await updateDoc(doc(db,'applications',appId), upd);
    renderDocsList(document.getElementById('docsList'), a); paintReviewSummary(appId);
    toast('تم قبول المستندات غير المرفوضة','success');
  } catch(e){ console.error(e); toast('تعذّر الحفظ','error'); }
}
function hasRejected(a){ const c = reviewCounts(a); return (c.fRej + c.dRej) > 0; }

async function handleAppAction(appId, act){
  if(act === 'approve'){
    const a = STATE.appsCache.get(appId);
    if(a && hasRejected(a)){ toast('يوجد عناصر مرفوضة — أرجع الطلب للعميل لتعديلها أولاً','warn'); return; }
    const ok = await confirmDialog({ title:'موافقة على الطلب', message:'سيتم تحويل الطلب إلى "مقبول" وسيظهر للزبون خيار الدفع.', confirmText:'موافقة' });
    if(!ok) return;
    if(a){
      const upd = {};
      REVIEW_FIELDS.forEach(([k]) => { if(fieldValue(a.personal, k)) upd[`fieldReview.${k}`] = { status:'accepted', reason:'' }; });
      DOC_KEYS.forEach(k => { const d = (a.documents||{})[k]; if(d && d.url){ upd[`documents.${k}.status`] = 'accepted'; upd[`documents.${k}.rejectReason`] = ''; } });
      if(Object.keys(upd).length) await updateDoc(doc(db,'applications',appId), upd);
    }
    await updateAppStatus(appId, 'approved', 'تمت الموافقة على طلبك، يمكنك الآن إتمام الدفع.');
    toast('تمت الموافقة','success');
    renderView('app-detail');
    return;
  }
  if(act === 'incomplete'){
    const a = STATE.appsCache.get(appId);
    if(!a || !hasRejected(a)){ toast('ارفض خانة أو مستنداً واحداً على الأقل قبل الإرجاع للعميل','warn'); return; }
    const ok = await confirmDialog({ title:'إرجاع للعميل', message:'سيرى العميل العناصر المرفوضة فقط مع أسبابها لتعديلها، وكل العناصر التي لم ترفضها ستُعتبر مقبولة. لن تُرسل رسالة دردشة.', confirmText:'إرجاع' });
    if(!ok) return;
    const upd = { status:'incomplete', statusHistory: arrayUnion({ status:'incomplete', at: Date.now(), by:'admin' }), updatedAt: serverTimestamp() };
    REVIEW_FIELDS.forEach(([k]) => {
      if(fieldValue(a.personal, k) && ((a.fieldReview||{})[k] || {}).status !== 'rejected') upd[`fieldReview.${k}`] = { status:'accepted', reason:'' };
    });
    DOC_KEYS.forEach(k => {
      const d = (a.documents||{})[k];
      if(d && d.url && d.status !== 'rejected'){ upd[`documents.${k}.status`] = 'accepted'; upd[`documents.${k}.rejectReason`] = ''; }
    });
    try {
      await updateDoc(doc(db,'applications',appId), upd);
      toast('تم إرجاع الطلب للعميل لتعديل المرفوض','success');
    } catch(e){ console.error(e); toast('تعذّر التنفيذ','error'); }
    renderView('app-detail');
    return;
  }
  if(act === 'reject-app'){
    const reason = await askRejectReason({
      title:'رفض الطلب',
      sub:'اختر سبباً أو اكتب ملاحظة',
      reasons: REJECT_REASONS_DOC
    });
    if(!reason) return;
    const ref = doc(db,'applications',appId);
    const history = { status:'rejected', at: Date.now(), by: 'admin', reason };
    await updateDoc(ref, {
      status:'rejected',
      rejectReason: reason,
      statusHistory: arrayUnion(history),
      updatedAt: serverTimestamp()
    });
    await notifyClient(appId, `تم رفض الطلب: ${reason}`);
    toast('تم رفض الطلب','success');
    renderView('app-detail');
    return;
  }
  if(act === 'delete'){
    const ok = await confirmDialog({ title:'حذف الطلب', message:'سيتم حذف هذا الطلب نهائياً من قائمة الطلبات ولا يمكن التراجع عن ذلك. هل أنت متأكد؟', confirmText:'حذف', danger:true });
    if(!ok) return;
    try {
      await deleteDoc(doc(db,'applications',appId));
      STATE.appsCache.delete(appId);
      STATE.openAppId = null;
      toast('تم حذف الطلب','success');
      goTo('applications');
    } catch(e){ console.error(e); toast('تعذّر حذف الطلب','error'); }
    return;
  }
  if(act === 'complete'){
    const ok = await confirmDialog({ title:'تحديد كمكتمل', message:'سيتم تحويل الطلب إلى "مكتمل". هل أنت متأكد؟', confirmText:'تأكيد' });
    if(!ok) return;
    await updateAppStatus(appId, 'completed', 'تم إكمال طلبك بنجاح. شكراً لاستخدامك خدمتنا.');
    toast('تم الإكمال','success');
    renderView('app-detail');
    return;
  }
}

/* ---- موافقة / إرجاع لكل خطوة على حدة (2 = البيانات، 3 = المستندات) ---- */
function acceptRemainingInStep(a, n, upd){
  if(n === 2){
    REVIEW_FIELDS.forEach(([k]) => {
      if(fieldValue(a.personal, k) && ((a.fieldReview||{})[k] || {}).status !== 'rejected') upd[`fieldReview.${k}`] = { status:'accepted', reason:'' };
    });
  } else {
    DOC_KEYS.forEach(k => {
      const d = (a.documents||{})[k];
      if(d && d.url && d.status !== 'rejected'){ upd[`documents.${k}.status`] = 'accepted'; upd[`documents.${k}.rejectReason`] = ''; }
    });
  }
}
async function handleStepAction(appId, n, act){
  /* نقرأ أحدث نسخة من الطلب (قد يكون العميل أعاد الإرسال بعد فتح الصفحة) */
  let a = STATE.appsCache.get(appId);
  try { const fs = await getDoc(doc(db,'applications',appId)); if(fs.exists()){ a = fs.data(); a.__id = appId; STATE.appsCache.set(appId, a); } } catch(e){}
  if(!a) return;
  const c = reviewCounts(a);
  const rej = n === 2 ? c.fRej : c.dRej;
  const cur = (a.steps || {})['s' + n] || {};
  const other = (a.steps || {})[n === 2 ? 's3' : 's2'];
  const stepObj = status => Object.assign({}, cur, { rev: cur.rev || 1, status, reviewedAt: Date.now() });
  const word = n === 2 ? 'البيانات' : 'المستندات';

  if(act === 'approve'){
    if(rej){ toast('يوجد عناصر مرفوضة في هذه الخطوة — أرجعها للعميل لتعديلها أولاً','warn'); return; }
    const ok = await confirmDialog({ title:`موافقة على الخطوة ${n}`, message:`سيتم قبول كل ${word} وينتقل العميل تلقائياً إلى الخطوة التالية.`, confirmText:'موافقة' });
    if(!ok) return;
    const upd = { updatedAt: serverTimestamp(), [`steps.s${n}`]: stepObj('approved') };
    acceptRemainingInStep(a, n, upd);
    if(['pending','incomplete'].includes(a.status) && !(other && other.status === 'processing')) upd.status = 'draft';
    upd.statusHistory = arrayUnion({ status: upd.status || a.status, at: Date.now(), by:'admin', note:`موافقة على الخطوة ${n} (${word})` });
    try { await updateDoc(doc(db,'applications',appId), upd); toast(`تمت الموافقة على الخطوة ${n}`,'success'); }
    catch(e){ console.error(e); toast('تعذّر التنفيذ','error'); }
    renderView('app-detail');
    return;
  }
  if(act === 'reject'){
    if(!rej){ toast('ارفض عنصراً واحداً على الأقل في هذه الخطوة قبل الإرجاع للعميل','warn'); return; }
    const ok = await confirmDialog({ title:`إرجاع الخطوة ${n} للعميل`, message:`سيرى العميل العناصر المرفوضة فقط مع أسبابها لتعديلها، وبقية ${word} تبقى مقبولة. لن تُرسل رسالة دردشة.`, confirmText:'إرجاع' });
    if(!ok) return;
    const upd = { status:'incomplete', updatedAt: serverTimestamp(), [`steps.s${n}`]: stepObj('rejected') };
    acceptRemainingInStep(a, n, upd);
    upd.statusHistory = arrayUnion({ status:'incomplete', at: Date.now(), by:'admin', note:`إرجاع الخطوة ${n} (${word}) للتعديل` });
    try { await updateDoc(doc(db,'applications',appId), upd); toast(`تم إرجاع الخطوة ${n} للعميل`,'success'); }
    catch(e){ console.error(e); toast('تعذّر التنفيذ','error'); }
    renderView('app-detail');
  }
}

async function acceptDoc(appId, key){

async function rejectDoc(appId, key){
  const reason = await askRejectReason({
    title:'رفض المستند',
    sub: docLabel(key),
    reasons: REJECT_REASONS_DOC
  });
  if(!reason) return;
  const ref = doc(db,'applications',appId);
  await updateDoc(ref, {
    [`documents.${key}.status`]: 'rejected',
    [`documents.${key}.rejectReason`]: reason,
    updatedAt: serverTimestamp()
  });
  /* سبب الرفض يظهر للعميل تحت المستند نفسه (بعد «إرجاع للعميل») وليس في الدردشة */
  const a = STATE.appsCache.get(appId);
  if(a && a.documents && a.documents[key]){ a.documents[key].status = 'rejected'; a.documents[key].rejectReason = reason; renderDocsList(document.getElementById('docsList'), a); paintReviewSummary(appId); }
  toast('تم رفض المستند','success');

function askRejectReason({ title, sub, reasons }){
  return new Promise(resolve => {
    const overlay = document.getElementById('modalOverlay');
    const card = document.getElementById('modalCard');
    card.innerHTML = `
      <div class="modal-head danger">
        <div class="avatar"><i class="fa-solid fa-circle-xmark"></i></div>
        <div class="title"><b>${esc(title||'سبب الرفض')}</b><span>${esc(sub||'')}</span></div>
        <button class="close" data-cancel="1"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <div id="reasonsList" style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px;"></div>
        <div class="field">
          <label>ملاحظة حرة (اختياري)</label>
          <textarea id="customReason" rows="2" placeholder="اكتب أي تفاصيل إضافية..."></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-secondary" data-cancel="1">إلغاء</button>
        <button class="btn btn-danger" id="confirmReason">تأكيد الرفض</button>
      </div>
    `;
    const list = card.querySelector('#reasonsList');
    reasons.forEach(r => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = r;
      btn.style.cssText = 'text-align:right;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:12.5px;font-weight:600;';
      btn.addEventListener('click', () => {
        list.querySelectorAll('button').forEach(x => x.style.background = '#fff');
        btn.style.background = 'var(--green-soft)';
        card.querySelector('#customReason').value = r;
      });
      list.appendChild(btn);
    });
    function close(val){
      overlay.classList.remove('open');
      document.body.classList.remove('no-scroll');
      resolve(val);
    }
    card.querySelectorAll('[data-cancel]').forEach(el => el.addEventListener('click', () => close(null)));
    overlay.addEventListener('click', e => { if(e.target === overlay) close(null); }, {once:true});
    card.querySelector('#confirmReason').addEventListener('click', () => {
      const val = card.querySelector('#customReason').value.trim();
      if(!val){ toast('اكتب أو اختر السبب','warn'); return; }
      close(val);
    });
    overlay.classList.add('open');
    document.body.classList.add('no-scroll');
  });
}

async function notifyClient(appId, text){
  try {
    const q = query(collection(db,'chats'), where('applicationId','==',appId), limit(1));
    const snap = await getDocs(q);
    if(snap.empty) return;
    const cid = snap.docs[0].id;
    await addDoc(collection(db,'messages'), {
      chatId: cid,
      sender: 'admin',
      text: text,
      createdAt: serverTimestamp(),
      read: false
    });
    await updateDoc(doc(db,'chats',cid), {
      lastMessage: text,
      lastMessageAt: serverTimestamp(),
      unreadForClient: increment(1),
      updatedAt: serverTimestamp()
    });
  } catch(err){ console.warn('[notifyClient]', err); }
}

function exportAppsCSV(){
  const list = STATE.apps.items;
  if(!list.length){ toast('لا توجد بيانات للتصدير','warn'); return; }
  const headers = ['رقم التتبع','اسم المتقدم','الهاتف','الرقم الوطني','رقم الجواز','العرض','الحالة','حالة الدفع','الإجمالي (SAR)','آخر تحديث'];
  const rows = list.map(a => {
    const p = a.personal||{};
    return [
      a.trackingId||'', a.customerName||'', (p.phoneCountry||'')+' '+(p.phone||''), p.nationalId||'', p.passportNumber||'',
      a.offerName||'', statusLabel(a.status), payStatusLabel(a.paymentStatus),
      (a.priceSnapshot?.total||0),
      fmtDateTimeAr(a.updatedAt)
    ];
  });
  const csv = '\uFEFF' + [headers, ...rows].map(r => r.map(v => `"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'applications-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function reloadPayments(){
  STATE.pay.items = [];
  STATE.pay.lastDoc = null;
  STATE.pay.hasMore = true;
  await loadMorePayments();
}

async function loadMorePayments(){
  if(STATE.pay.loading) return;
  STATE.pay.loading = true;
  const wrap = document.getElementById('payListWrap');
  if(!wrap) return;
  if(STATE.pay.items.length === 0){
    wrap.innerHTML = '<div class="loading-block"><div class="spinner"></div>جارٍ التحميل...</div>';
  }
  try {
    const PAGE = 30;
    const parts = [collection(db,'payments')];
    if(STATE.pay.filterStatus) parts.push(where('status','==', STATE.pay.filterStatus));
    parts.push(orderBy('createdAt','desc'));
    parts.push(limit(PAGE));
    if(STATE.pay.lastDoc) parts.push(startAfter(STATE.pay.lastDoc));
    const q = query(...parts);
    const snap = await getDocs(q);
    let list = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    STATE.pay.lastDoc = snap.docs[snap.docs.length-1] || null;
    STATE.pay.hasMore = snap.size === PAGE;

    const term = (STATE.pay.search||'').toLowerCase();
    if(term){
      list = list.filter(p => [p.trackingId, p.invoiceNumber, p.customerName].filter(Boolean).join(' ').toLowerCase().includes(term));
    }
    STATE.pay.items = STATE.pay.items.concat(list);
    renderPaymentsList();
    const btn = document.getElementById('payLoadMore');
    if(btn) btn.style.display = STATE.pay.hasMore ? 'inline-flex' : 'none';
  } catch(err){
    console.error('[loadMorePayments]', err);
    if(wrap) wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><p>تعذّر تحميل الدفعات.</p></div>';
  } finally { STATE.pay.loading = false; }
}

async function confirmPayment(p){
  const ok = await confirmDialog({
    title:'تأكيد الدفع',
    message:`تأكيد استلام مبلغ ${fmtSAR(p.amount)} بطريقة ${methodLabel(p.method)}؟`,
    confirmText:'تأكيد'
  });
  if(!ok) return;
  try {
    await updateDoc(doc(db,'payments',p.id), {
      status: 'confirmed',
      confirmedAt: serverTimestamp()
    });
    if(p.applicationId){
      await updateDoc(doc(db,'applications',p.applicationId), {
        paymentStatus: 'confirmed',
        status: 'paid',
        statusHistory: arrayUnion({ status:'paid', at: Date.now(), by: 'admin', reason: 'تأكيد الدفع' }),
        updatedAt: serverTimestamp()
      });
      await notifyClient(p.applicationId, 'تم تأكيد الدفع بنجاح. سيبدأ العمل على إصدار التأشيرة.');
    }
    toast('تم تأكيد الدفع','success');
    reloadPayments();
  } catch(err){
    console.error(err);
    toast('تعذّر التأكيد','error');
  }
}

async function rejectPayment(p){
  const reason = await askRejectReason({
    title:'رفض الدفعة',
    sub:`المبلغ ${fmtSAR(p.amount)} · ${methodLabel(p.method)}`,
    reasons: REJECT_REASONS_PAY
  });
  if(!reason) return;
  try {
    await updateDoc(doc(db,'payments',p.id), {
      status: 'rejected',
      rejectReason: reason,
      rejectedAt: serverTimestamp()
    });
    if(p.applicationId){
      await updateDoc(doc(db,'applications',p.applicationId), {
        paymentStatus: 'rejected',
        status: 'approved',
        updatedAt: serverTimestamp()
      });
      await notifyClient(p.applicationId, `المستند المرفوع غير صحيح: ${reason}. يرجى رفع إيصال جديد.`);
    }
    if(p.method === 'western' && p.quotaConsumed && !p.quotaRestored){
      try {
        await runTransaction(db, async (tx) => {
          const qRef = doc(db,'settings','westernUnionQuota');
          const qSnap = await tx.get(qRef);
          if(!qSnap.exists()) return;
          const d = qSnap.data() || {};
          const newCount = Math.max(0, (Number(d.count)||0) - 1);
          tx.update(qRef, { count: newCount });
        });
        await updateDoc(doc(db,'payments',p.id), { quotaRestored: true });
      } catch(e){ console.warn('[quota refund]', e); }
    }
    toast('تم رفض الدفعة','success');
    reloadPayments();
  } catch(err){
    console.error(err);
    toast('تعذّر الرفض','error');
  }
}

      </div>
    </div>
  `;

  panel.querySelector('#goToApp')?.addEventListener('click', () => { if(c.applicationId) openAppDetail(c.applicationId); });

  renderQuickReplies(panel.querySelector('#quickReplies'), panel.querySelector('#chatMsgInput'));

  panel.querySelector('#chatMsgSend').addEventListener('click', () => sendAdminMessage(chatId));
  panel.querySelector('#chatMsgInput').addEventListener('keydown', e => {
    if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendAdminMessage(chatId); }
  });

  const q = query(collection(db,'messages'), where('chatId','==',chatId), orderBy('createdAt','asc'));
  STATE.chats.msgUnsub = onSnapshot(q, snap => {
    const msgs = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderChatMsgs(msgs, focus);
    updateDoc(doc(db,'chats',chatId), { unreadForAdmin: 0 }).catch(()=>{});
    msgs.forEach(m => {
      if(m.sender === 'client' && m.read !== true){
        updateDoc(doc(db,'messages',m.id), { read: true }).catch(()=>{});

    console.warn('[chatMsgs]', err);
    const w = panel.querySelector('#chatMsgsWrap');

function renderChatMsgs(msgs, focus){
  const wrap = document.getElementById('chatMsgsWrap');
  if(!wrap) return;
  if(!msgs.length){
    wrap.innerHTML = '<div class="empty-state" style="padding:20px;"><p>لا رسائل بعد.</p></div>';
    return;
  }
  wrap.innerHTML = '';
  msgs.forEach(m => {
    const div = document.createElement('div');
    div.className = 'msg ' + (m.sender === 'admin' ? 'admin' : 'client');
    const time = toDate(m.createdAt) ? toDate(m.createdAt).toLocaleTimeString('ar-SA',{hour:'2-digit',minute:'2-digit'}) : '';
    div.innerHTML = `<span></span><span class="meta">${esc(time)}</span>`;
    div.firstChild.textContent = m.text || '';
    if(m.attachmentUrl){
      const a = document.createElement('a');
      a.className = 'attach-link';
      a.href = m.attachmentUrl;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = '📎 مرفق';
      div.insertBefore(a, div.lastChild);
    }
    wrap.appendChild(div);
  });
  if(focus) wrap.scrollTop = wrap.scrollHeight;
}

async function sendAdminMessage(chatId){

  try {
    await addDoc(collection(db,'messages'), {
      chatId,
      sender: 'admin',
      text,
      createdAt: serverTimestamp(),
      read: false

    await updateDoc(doc(db,'chats',chatId), {
      lastMessage: text,
      lastMessageAt: serverTimestamp(),

function editQuickReplies(current){
