/* =====================================================================
   المكالمات الصوتية الواردة (WebRTC مباشر — لا حاجة لتسجيل دخول العميل)
   voiceCalls/{id}: status ringing|active|ended, offer, answer, callerCandidates, calleeCandidates
   ===================================================================== */
let acPc = null, acId = null, acStream = null, acUnsubs = [], ringTimer = null, ringCtx = null, ringingCalls = [];
const _fresh = v => v && v.offer && (Date.now() - (Number(v.createdAt) || Date.now())) < 90000;
function startRing(){
  if(ringTimer) return;
  const beep = () => { try{
    ringCtx = ringCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = ringCtx.createOscillator(), g = ringCtx.createGain();
    o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(ringCtx.destination);
    o.start(); o.stop(ringCtx.currentTime + .4);
  }catch(e){} };
  beep(); ringTimer = setInterval(beep, 1800);
}
function stopRing(){ clearInterval(ringTimer); ringTimer = null; }
function renderIncomingBanner(){
  const list = ringingCalls.filter(_fresh);
  let b = document.getElementById('incomingCall');
  if(!list.length || acPc){ b?.remove(); stopRing(); return; }
  const v = list[0];
  if(!b){
    b = document.createElement('div'); b.id = 'incomingCall';
    b.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99999;background:#065f46;color:#fff;padding:12px 18px;border-radius:16px;display:flex;gap:12px;align-items:center;font:700 14px sans-serif;direction:rtl;box-shadow:0 8px 28px rgba(0,0,0,.4)';
    document.body.appendChild(b);
  }
  b.innerHTML = `<i class="fa-solid fa-phone-volume"></i><span>مكالمة واردة: ${esc(v.customerName || 'زائر')}${list.length > 1 ? ' (+' + (list.length-1) + ')' : ''}</span>
    <button id="icAnswer" style="background:#22c55e;color:#fff;border:0;border-radius:999px;padding:7px 14px;font-weight:800;cursor:pointer">رد</button>
    <button id="icDecline" style="background:#dc2626;color:#fff;border:0;border-radius:999px;padding:7px 14px;font-weight:800;cursor:pointer">رفض</button>`;
  b.querySelector('#icAnswer').onclick = () => answerCall(v.id, v);
  b.querySelector('#icDecline').onclick = () => updateDoc(doc(db,'voiceCalls',v.id), { status:'ended', updatedAt: serverTimestamp() }).catch(()=>{});
  startRing();
}
function subscribeIncomingCalls(){
  onSnapshot(query(collection(db,'voiceCalls'), where('status','==','ringing')), snap => {
    ringingCalls = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    renderIncomingBanner();
  }, e => console.warn('[calls]', e));
  setInterval(renderIncomingBanner, 10000);
}
async function hangUpCall(notify){
  acUnsubs.forEach(u => { try{ u(); }catch(e){} }); acUnsubs = [];
  if(notify && acId){ try{ await updateDoc(doc(db,'voiceCalls',acId), { status:'ended', updatedAt: serverTimestamp() }); }catch(e){} }
  if(acStream){ acStream.getTracks().forEach(t => t.stop()); acStream = null; }
  if(acPc){ try{ acPc.close(); }catch(e){} acPc = null; }
  acId = null;
  document.getElementById('adminCallBar')?.remove();
  renderIncomingBanner();
}
async function answerCall(id, v){
  stopRing();
  try { acStream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch(e){ toast('اسمح باستخدام الميكروفون للرد', 'error'); return; }
  try {
    const snap = await getDoc(doc(db,'voiceCalls',id));
    const d = snap.exists() ? snap.data() : null;
    if(!d || d.status !== 'ringing' || !d.offer){ toast('المكالمة لم تعد متاحة', 'warn'); acStream.getTracks().forEach(t => t.stop()); acStream = null; return; }
    const pc = acPc = new RTCPeerConnection({ iceServers:[{ urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302'] }] });
    acId = id;
    acStream.getTracks().forEach(t => pc.addTrack(t, acStream));
    let audio = document.getElementById('adminCallAudio');
    if(!audio){ audio = document.createElement('audio'); audio.id = 'adminCallAudio'; audio.autoplay = true; document.body.appendChild(audio); }
    pc.ontrack = e => { audio.srcObject = e.streams[0]; };
    pc.onicecandidate = e => { if(e.candidate) addDoc(collection(db,`voiceCalls/${id}/calleeCandidates`), e.candidate.toJSON()).catch(()=>{}); };
    await pc.setRemoteDescription(new RTCSessionDescription(d.offer));
    const ans = await pc.createAnswer(); await pc.setLocalDescription(ans);
    await updateDoc(doc(db,'voiceCalls',id), { answer:{ type:ans.type, sdp:ans.sdp }, status:'active', answeredAt: serverTimestamp(), updatedAt: serverTimestamp() });
    const seen = new Set();
    acUnsubs.push(onSnapshot(query(collection(db,`voiceCalls/${id}/callerCandidates`)), s => {
      s.forEach(c => { if(seen.has(c.id)) return; seen.add(c.id); pc.addIceCandidate(new RTCIceCandidate(c.data())).catch(()=>{}); });
    }));
    acUnsubs.push(onSnapshot(doc(db,'voiceCalls',id), s => {
      const x = s.exists() ? s.data() : null;
      if(x && x.status === 'ended'){ toast('انتهت المكالمة', ''); hangUpCall(false); }
    }));
    let bar = document.getElementById('adminCallBar');
    if(!bar){
      bar = document.createElement('div'); bar.id = 'adminCallBar';
      bar.style.cssText = 'position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:99999;background:#111827;color:#fff;padding:10px 16px;border-radius:999px;display:flex;gap:12px;align-items:center;font:700 13px sans-serif;direction:rtl;box-shadow:0 8px 28px rgba(0,0,0,.4)';
      document.body.appendChild(bar);
    }
    bar.innerHTML = `<i class="fa-solid fa-phone"></i><span>مكالمة جارية: ${esc((v && v.customerName) || 'زائر')}</span><button id="acEnd" style="background:#dc2626;color:#fff;border:0;border-radius:999px;padding:6px 12px;font-weight:800;cursor:pointer">إنهاء</button>`;
    bar.querySelector('#acEnd').onclick = () => hangUpCall(true);
    renderIncomingBanner();
  } catch(err){
    console.error('[answerCall]', err); toast('تعذّر الرد على المكالمة', 'error'); hangUpCall(true);
  }
}
async function renderVoice(el){
  el.innerHTML = '<div id="voiceWrap" class="loading-block"><div class="spinner"></div>جارٍ التحميل...</div>';
  STATE.voice.unsub = onSnapshot(query(collection(db,'voiceCalls'), where('status','in',['ringing','active'])), snap => {
    const list = snap.docs.map(d => ({ id:d.id, ...d.data() })).filter(v => v.status === 'active' || _fresh(v))
      .sort((a,b) => (Number(b.createdAt)||0) - (Number(a.createdAt)||0));
    const wrap = document.getElementById('voiceWrap'); if(!wrap) return;

    wrap.innerHTML = '';
    list.forEach(v => {

      card.className = 'card'; card.style.marginTop = '0'; card.style.marginBottom = '10px';
      card.innerHTML = `<div class="card-head"><h3 style="font-size:14px;"><i class="fa-solid fa-phone-volume"></i> ${esc(v.customerName || 'زائر')}</h3><div>${v.status === 'ringing' ? 'يرن الآن' : 'جارية'}</div></div>
        <div class="detail-grid"><div class="row"><span class="k">الهاتف</span><span class="v" style="direction:ltr;text-align:left;">${esc(v.customerPhone || '—')}</span></div>
        <div class="row"><span class="k">وقت الاتصال</span><span class="v">${esc(fmtDateTimeAr(v.createdAt))}</span></div></div>
        <div style="display:flex;gap:8px;margin-top:12px;">${v.status === 'ringing' ? '<button class="btn btn-primary btn-sm" data-ans="1"><i class="fa-solid fa-phone"></i> رد</button>' : ''}
        <button class="btn btn-secondary btn-sm" data-end="1">إنهاء</button></div>`;
      card.querySelector('[data-ans]')?.addEventListener('click', () => answerCall(v.id, v));
      card.querySelector('[data-end]').addEventListener('click', () => updateDoc(doc(db,'voiceCalls',v.id), { status:'ended', updatedAt: serverTimestamp() }));
      wrap.appendChild(card);
    });
  }, () => { const w = document.getElementById('voiceWrap'); if(w) w.innerHTML = '<div class="empty-state"><p>تعذّر التحميل.</p></div>'; });
}
subscribeIncomingCalls();

      <div class="field-row">
        <div class="field"><label>1 SAR = USD</label><input type="number" step="0.0001" min="0" id="fx_usd" value="${esc(rates.USD?.rate||0)}"></div>
        <div class="field"><label>1 SAR = SYP</label><input type="number" step="1" min="0" id="fx_syp" value="${esc(rates.SYP?.rate||0)}"></div>
      </div>
      <p class="field hint">تُحدَّث التواريخ تلقائياً عند الحفظ بتاريخ اليوم.</p>
      <button class="btn btn-primary" id="saveFx"><i class="fa-solid fa-floppy-disk"></i> حفظ الأسعار</button>
    </div>
  `;
  document.getElementById('saveFx').addEventListener('click', async (ev) => {
    const usd = Number(document.getElementById('fx_usd').value);
    const syp = Number(document.getElementById('fx_syp').value);
    if(!(usd > 0) || !(syp > 0)){ toast('يجب أن تكون الأسعار موجبة','warn'); return; }
    ev.currentTarget.disabled = true;
    try {
      const newRates = {
        ...rates,
        USD: { ...rates.USD, rate: usd },
        SYP: { ...rates.SYP, rate: syp }
      };
      const lastUpdated = new Date().toISOString().slice(0,10);
      await setDoc(doc(db,'settings','fx'), { lastUpdated, base:'SAR', rates: newRates }, { merge:true });
      STATE.settings.fx = { ...STATE.settings.fx, lastUpdated, rates: newRates };
      toast('تم الحفظ','success');
    } catch(e){ console.error(e); toast('تعذّر الحفظ','error'); }
    finally { ev.currentTarget.disabled = false; }
  });
}

async function loadQuotaTab(){
  const tab = document.getElementById('tab-quota');
  tab.innerHTML = '<div class="loading-block"><div class="spinner"></div></div>';
  const s = await getDoc(doc(db,'settings','westernUnionQuota'));
  const q = s.exists() ? s.data() : { count:0, resetAt:0 };
  const pSnap = await getDoc(doc(db,'settings','payment'));
  const limitVal = Number(pSnap.exists() ? (pSnap.data().westernUnion?.dailyLimit||2) : 2);
  const now = Date.now();
  const resetAt = Number(q.resetAt)||0;
  const isReset = (now - resetAt) > 24*60*60*1000;
  const effectiveCount = isReset ? 0 : (Number(q.count)||0);
  const remainMs = isReset ? 0 : Math.max(0, resetAt + 24*60*60*1000 - now);
  const h = Math.floor(remainMs / 3600000);
  const m = Math.floor((remainMs % 3600000) / 60000);
  tab.innerHTML = `
    <div class="card">
      <div class="card-head"><h3><i class="fa-solid fa-money-bill-transfer"></i> حصة ويسترن اليوم</h3></div>
      <div class="detail-grid">
        <div class="row"><span class="k">المستهلك</span><span class="v">${effectiveCount} من ${limitVal}</span></div>
        <div class="row"><span class="k">المتبقي</span><span class="v">${Math.max(0, limitVal - effectiveCount)}</span></div>
        <div class="row"><span class="k">وقت التجديد</span><span class="v">${isReset ? 'متاح الآن' : `${h} ساعة و ${m} دقيقة`}</span></div>
        <div class="row"><span class="k">آخر تصفير</span><span class="v">${resetAt ? esc(fmtDateTimeAr(resetAt)) : '—'}</span></div>
      </div>
      <button class="btn btn-gold" id="resetQuota"><i class="fa-solid fa-eraser"></i> تصفير العدّاد</button>
    </div>
  `;
  document.getElementById('resetQuota').addEventListener('click', async () => {
    const ok = await confirmDialog({ title:'تصفير العدّاد', message:'سيتم تصفير العدّاد فوراً. متابعة؟', confirmText:'تصفير', danger:true });
    if(!ok) return;
    try {
      await setDoc(doc(db,'settings','westernUnionQuota'), { count:0, resetAt: Date.now() }, { merge:true });
      toast('تم التصفير','success');
      loadQuotaTab();
    } catch(e){ console.error(e); toast('تعذّر التصفير','error'); }
  });
}

async function loadReviewsTab(){
  const tab = document.getElementById('tab-reviews');
  tab.innerHTML = '<div class="loading-block"><div class="spinner"></div></div>';
  try {
    const snap = await getDocs(query(collection(db,'reviews'), orderBy('createdAt','desc'), limit(100)));
    const list = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    STATE.settings.reviews = list;
    if(!list.length){
      tab.innerHTML = '<div class="empty-state"><i class="fa-solid fa-star"></i><p>لا توجد تقييمات.</p></div>';
      return;
    }
    tab.innerHTML = '';
    list.forEach(r => {
      const stars = Number(r.stars)||0;
      const starsHtml = Array.from({length:5},(_,i) => `<i class="fa-${i<stars?'solid':'regular'} fa-star" style="color:var(--gold);"></i>`).join('');
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-head">
          <h3 style="font-size:14px;">${starsHtml} <small style="color:var(--text-3);font-weight:600;">(${stars}/5)</small></h3>
          <button class="btn btn-danger btn-sm" data-del-review="${esc(r.id)}"><i class="fa-solid fa-trash"></i> حذف</button>
        </div>
        <div class="detail-grid">
          <div class="row"><span class="k">العرض</span><span class="v">${esc(r.offerId||'—')}</span></div>
          <div class="row"><span class="k">رقم الطلب</span><span class="v">${esc((r.applicationId||'').slice(0,10))}</span></div>
          <div class="row"><span class="k">التاريخ</span><span class="v">${esc(fmtDateTimeAr(r.createdAt))}</span></div>
        </div>
        ${r.comment ? `<p style="margin-top:10px;font-size:13px;color:var(--text-2);line-height:1.9;">${esc(r.comment)}</p>` : ''}
      `;
      card.querySelector(`[data-del-review="${CSS.escape(r.id)}"]`)?.addEventListener('click', async () => {
        const ok = await confirmDialog({ title:'حذف التقييم', message:'هل تريد حذف هذا التقييم نهائياً؟', confirmText:'حذف', danger:true });
        if(!ok) return;
        try {
          await deleteDoc(doc(db,'reviews',r.id));
          toast('تم الحذف','success');
          loadReviewsTab();
        } catch(e){ console.error(e); toast('تعذّر الحذف','error'); }
      });
      tab.appendChild(card);
    });
  } catch(err){
    console.warn('[reviews]', err);
    tab.innerHTML = '<div class="empty-state"><p>تعذّر تحميل التقييمات.</p></div>';
  }
}

/* =====================================================================
   util: debounce
   ===================================================================== */
function debounce(fn, ms){
  let t;
  return function(...args){
    clearTimeout(t);
    t = setTimeout(() => fn.apply(this, args), ms);
  };
}

document.addEventListener('keydown', e => {
  if(e.key === 'Escape'){
    const ov = document.getElementById('modalOverlay');
    if(ov.classList.contains('open')){
      ov.classList.remove('open');
      document.body.classList.remove('no-scroll');
    }
  }
});

/* =====================================================================
   الإقلاع — افتح اللوحة مباشرة
   ===================================================================== */

/* =====================================================================
   أصوات الإشعارات (مولّدة بالمتصفح — لا ملفات): 3 نغمات مختلفة
   - طلب جديد / تعديل مُرسل للمراجعة : نغمة صاعدة (دينغ-دونغ)
   - طلب دفع (إيصال جديد)             : رنّة سريعة عالية (كاشير)
   - رسالة جديدة من العميل           : نقرة ناعمة منخفضة
   ===================================================================== */
const SOUND = { ctx:null, off: localStorage.getItem('admin_sound_off') === '1', last:{} };
function _tone(freq, t0, dur, type, vol){
  const c = SOUND.ctx, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + dur + 0.02);
}
function playSound(kind){
  if(SOUND.off) return;
  const now = Date.now();
  /* الرسالة لا تُصدر صوتها إن صدر صوت طلب/دفع قبل لحظات (مثلاً رسالة النظام التلقائية) */
  if(kind === 'message' && (now - (SOUND.last.request || 0) < 2500 || now - (SOUND.last.payment || 0) < 2500)) return;
  if(now - (SOUND.last[kind] || 0) < 700) return;
  SOUND.last[kind] = now;
  try {
    SOUND.ctx = SOUND.ctx || new (window.AudioContext || window.webkitAudioContext)();
    if(SOUND.ctx.state === 'suspended') SOUND.ctx.resume();
    const t = SOUND.ctx.currentTime + 0.02;
    if(kind === 'request'){ _tone(659.25, t, .22, 'sine', .28); _tone(880, t + .2, .22, 'sine', .28); _tone(1318.5, t + .4, .45, 'sine', .3); }
    else if(kind === 'payment'){ _tone(1568, t, .09, 'triangle', .25); _tone(1568, t + .1, .09, 'triangle', .25); _tone(1568, t + .2, .09, 'triangle', .25); _tone(2093, t + .32, .5, 'triangle', .3); }
    else { _tone(740, t, .16, 'sine', .22); _tone(587.3, t + .1, .2, 'sine', .18); }
  } catch(e){}
}
function paintSoundBtn(){
  const b = document.getElementById('soundBtn'); if(!b) return;
  b.classList.toggle('sound-off', SOUND.off);
  b.innerHTML = `<i class="fa-solid ${SOUND.off ? 'fa-bell-slash' : 'fa-bell'}"></i>`;
  b.title = SOUND.off ? 'الأصوات متوقفة — اضغط للتشغيل' : 'الأصوات تعمل — اضغط للإيقاف';
}
document.getElementById('soundBtn').addEventListener('click', () => {
  SOUND.off = !SOUND.off;
  localStorage.setItem('admin_sound_off', SOUND.off ? '1' : '0');
  paintSoundBtn();
  if(!SOUND.off) playSound('message');
});
/* المتصفح يمنع الصوت قبل أول لمسة من المستخدم */
['pointerdown','keydown'].forEach(ev => document.addEventListener(ev, function unlock(){
  try{ SOUND.ctx = SOUND.ctx || new (window.AudioContext || window.webkitAudioContext)(); SOUND.ctx.resume(); }catch(e){}
  document.removeEventListener(ev, unlock);
}));
paintSoundBtn();

function subscribeSounds(){
  /* طلبات: خطوة 2 أو 3 دخلت "قيد المعالجة" بإرسال جديد (أول مرة أو تعديل) */
  let appSeen = null;
  onSnapshot(query(collection(db,'applications'), limit(300)), snap => {
    const cur = {};
    let ring = false;
    snap.forEach(d => {
      const a = d.data() || {}, st = a.steps || {};
      const sig = ['s2','s3'].map(k => st[k] && st[k].status === 'processing' ? (st[k].rev || 1) : 0).join('-');
      cur[d.id] = sig;
      if(appSeen && sig !== '0-0' && appSeen[d.id] !== sig) ring = true;
    });
    appSeen = cur;
    if(ring) playSound('request');
  }, () => {});

  /* دفعات: إيصال جديد بانتظار المراجعة */
  let paySeen = null;
  onSnapshot(query(collection(db,'payments'), where('status','==','pending_confirmation'), limit(300)), snap => {
    const ids = new Set(); let ring = false;
    snap.forEach(d => { ids.add(d.id); if(paySeen && !paySeen.has(d.id)) ring = true; });
    paySeen = ids;
    if(ring) playSound('payment');
  }, () => {});

  /* رسائل: ارتفع عدّاد غير المقروء للإدارة */
  let chatSeen = null;
  onSnapshot(query(collection(db,'chats'), limit(300)), snap => {
    const cur = {}; let ring = false;
    snap.forEach(d => {
      const n = Number((d.data() || {}).unreadForAdmin || 0);
      cur[d.id] = n;
      if(chatSeen && n > (chatSeen[d.id] || 0)) ring = true;
    });
    chatSeen = cur;
    if(ring) playSound('message');
  }, () => {});
}

(function boot(){
  // ابدأ الاشتراكات العامة ثم اعرض لوحة المعلومات
  subscribeNavBadges();
  subscribeSounds();
  goTo('dashboard');
  console.log('[Admin Panel] ready (no auth)');
})();
